<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destinations | Safer Cruise</title>
  <meta name="description" content="Every port AROYA calls at in Saudi Arabia, Egypt and Jordan, with excursions, visa notes and the cruises that visit.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="site-header" data-active="destinations"></div>

  <main class="flex-1">
    <!-- =========================================================
         PAGE HEAD + COUNTRY FILTER
         ========================================================= -->
    <section class="bg-ocean-700 text-white">
      <div class="max-w-site mx-auto px-4 sm:px-6 py-12 sm:py-16">
        <nav class="text-sm text-ocean-200 mb-3" aria-label="Breadcrumb"><a href="index.html" class="hover:text-white">Home</a> <span class="mx-1">/</span> <span class="text-white">Destinations</span></nav>
        <h1 class="font-display font-bold text-4xl sm:text-5xl">Where AROYA calls</h1>
        <p class="mt-3 text-ocean-100 max-w-[60ch]">Six ports across three countries. See what to do in each, the visa rules, and which cruises stop there.</p>
        <div class="mt-8 flex flex-wrap gap-2" role="tablist" aria-label="Filter by country" id="country-filter"></div>
      </div>
    </section>

    <!-- Quick jump list -->
    <div class="sticky top-[72px] z-30 bg-white/95 backdrop-blur border-b border-line">
      <nav class="max-w-site mx-auto px-4 sm:px-6 flex gap-1 overflow-x-auto no-scrollbar" aria-label="Ports" id="port-nav"></nav>
    </div>

    <!-- Destination rows -->
    <section class="max-w-site mx-auto px-4 sm:px-6 py-14 sm:py-20">
      <div id="dest-list" class="grid gap-16 sm:gap-24"></div>
    </section>

    <!-- CTA -->
    <section class="max-w-site mx-auto px-4 sm:px-6 pb-20 sm:pb-24">
      <div class="rounded-[28px] bg-ocean-700 text-white px-6 py-12 sm:px-12 flex flex-wrap items-center justify-between gap-6">
        <div>
          <h2 class="font-display font-bold text-3xl">Found your port?</h2>
          <p class="text-ocean-100 mt-2">Compare every sailing and its dates in one list.</p>
        </div>
        <a href="catalog.html" class="btn btn-accent btn-lg">See all cruises</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/destinations.js"></script>
</body>
</html>
