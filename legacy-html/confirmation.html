<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking confirmed | Safer Cruise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="site-header" data-active=""></div>

  <!-- Shown after the guest confirms. The site has no online payment; payment is arranged offline. -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-10 sm:py-14">
    <section id="none" class="hidden text-center py-16">
      <h1 class="font-display font-bold text-2xl">No completed booking to show</h1>
      <p class="text-muted mt-2">Your confirmed trips are always in My bookings.</p>
      <div class="mt-6 flex justify-center gap-3"><a href="dashboard.html" class="btn btn-primary">My bookings</a><a href="index.html" class="btn btn-outline">Home</a></div>
    </section>

    <div id="success" class="hidden">
      <div class="text-center">
        <span class="inline-grid place-items-center w-16 h-16 rounded-full bg-[#E3F5EE] text-[#12805C]"><i data-icon="check" class="w-8 h-8"></i></span>
        <h1 class="font-display font-bold text-3xl sm:text-4xl mt-5">Your cruise is booked</h1>
        <p class="text-muted mt-3 max-w-[52ch] mx-auto" id="sent-to"></p>
      </div>

      <!-- Voucher: also what prints -->
      <article class="card pass overflow-hidden mt-10" style="--perf-bg:#F5F8FB" id="voucher">
        <div class="bg-ocean-700 text-white p-6 sm:p-7 flex flex-wrap items-center justify-between gap-4">
          <div>
            <p class="text-xs text-ocean-200 font-semibold">Booking reference</p>
            <p class="font-display font-bold text-3xl tabular tracking-wide" id="ref"></p>
          </div>
          <div class="text-end">
            <span class="inline-flex items-center gap-1.5 rounded-full bg-[#E3F5EE] text-[#0E6B4C] px-3 py-1 text-sm font-bold"><i data-icon="check" class="w-4 h-4"></i> Confirmed</span>
            <p class="text-sm text-ocean-100 mt-2">Total <b class="text-white tabular" id="paid"></b></p>
          </div>
        </div>
        <div class="p-6 sm:p-7" id="trip"></div>
        <div class="perf-x"></div>
        <div class="p-6 sm:p-7" id="people"></div>
      </article>

      <div class="mt-8 flex flex-wrap justify-center gap-3 no-print">
        <button class="btn btn-accent" onclick="window.print()"><i data-icon="download" class="w-5 h-5"></i> Download voucher</button>
        <a href="dashboard.html" class="btn btn-outline">View in my bookings</a>
        <a href="index.html" class="btn btn-ghost">Back to home</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script>
    /* Success page: reads the confirmed booking from the session */
    document.addEventListener('sc:ready', () => {
      const D = window.SC_DATA, { $ } = SC;
      const b = SC.booking.get();
      if (!b || b.status !== 'confirmed') { $('#none').classList.remove('hidden'); return; }
      $('#success').classList.remove('hidden');
      const cabin = SC.getCabin(b.cabinId);

      $('#ref').textContent = b.ref;
      $('#paid').textContent = SC.money(b.amountDue);
      $('#sent-to').innerHTML = `We've sent your booking details to <b class="text-ink">${SC.esc(b.contact.email)}</b> and <b class="text-ink" dir="ltr">${SC.esc(b.contact.dial)} ${SC.esc(b.contact.phone)}</b>. Our team will contact you within 24 hours to arrange payment.`;

      const row = (l, v) => `<div><dt class="text-xs font-semibold text-muted">${l}</dt><dd class="font-bold mt-0.5">${v}</dd></div>`;
      $('#trip').innerHTML = `
        <h2 class="font-display font-semibold text-xl">${SC.esc(b.cruiseName)}</h2>
        <dl class="grid grid-cols-2 sm:grid-cols-3 gap-5 mt-5">
          ${row('Ship', b.ship)}${row('Departs', `${SC.fmtDate(b.departure)}, ${b.departurePort}`)}${row('Returns', `${SC.fmtDate(b.returnDate)}, ${b.arrivalPort}`)}
          ${row('Duration', `${b.nights} nights`)}${row('Cabin', cabin.nameEn)}${row('Guests', SC.guestText(b.guests))}
        </dl>`;

      const slots = Object.entries(b.travellers);
      $('#people').innerHTML = `
        <h3 class="font-bold mb-3">Travellers</h3>
        <ul class="grid sm:grid-cols-2 gap-3">${slots.map(([k, t]) => `
          <li class="rounded-xl bg-page p-3 flex items-center justify-between gap-3">
            <span><span class="block font-bold">${SC.esc(t.first)} ${SC.esc(t.last)}</span><span class="text-xs text-muted">${SC.esc(t.nationality)}</span></span>
            <span class="tag tag-ocean">${D.ageBands[k.split('-')[0]].label}</span>
          </li>`).join('')}
        </ul>`;
    });
  </script>
</body>
</html>
